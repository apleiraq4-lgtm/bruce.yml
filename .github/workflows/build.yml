name: Build Bruce - C5 PCB3501S

# XH-C5E (ESP32-C5-N16R8) + 3.5" PCB3501S (ILI9488 + XPT2046). Flash Bruce-*.bin at 0x0.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bruce.yml"

env:
  BRUCE_SHA: 2b6ba4d490bfcf94ce2574c6154537dbd5838c3d
  SELECTED_ENV: esp32-c5-pcb3501s

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Bruce + submodules
        run: |
          set -e
          git clone --filter=blob:none https://github.com/pr3y/Bruce.git bruce
          cd bruce
          git checkout "$BRUCE_SHA"
          git submodule update --init --recursive
          echo "Bruce at $(git rev-parse --short HEAD)"

