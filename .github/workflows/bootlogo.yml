name: Build Bruce BootLogo - C5 PCB3501S

# Builds ONLY the LittleFS image that holds /boot.jpg (the custom boot splash).
# Does NOT touch the working Bruce firmware. Flash littlefs.bin at 0x4F0000.

on:
  workflow_dispatch:

env:
  BRUCE_SHA: 2b6ba4d490bfcf94ce2574c6154537dbd5838c3d
  SELECTED_ENV: esp32-c5-pcb3501s

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Bruce + submodules
        run: |
          set -e
          git clone --filter=blob:none https://github.com/pr3y/Bruce.git bruce
          cd bruce
          git checkout "$BRUCE_SHA"
          git submodule update --init --recursive
          echo "Bruce at $(git rev-parse --short HEAD)"

