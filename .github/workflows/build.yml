      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests esptool intelhex platformio

      - name: Apply version
        run: |
          cd bruce
          version="${GITHUB_SHA::7}"
          sed -i "s/-DBRUCE_VERSION='\"dev\"'/-DBRUCE_VERSION='\"$version\"'/g" ./platformio.ini || true

      - name: Build
        run: |
          set -o pipefail
          cd bruce
          platformio run -e "$SELECTED_ENV" | tee "../build-$SELECTED_ENV.log"

      - name: Build summary
        if: always()
        run: |
          echo "==== last 90 log lines ===="
          tail -n 90 "build-$SELECTED_ENV.log" 2>/dev/null || echo "no log file"
          echo "==== output bins ===="
          ls -la bruce/Bruce-*.* 2>/dev/null || echo "no Bruce bin produced"

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bruce-${{ env.SELECTED_ENV }}
          path: bruce/Bruce-*.*
          retention-days: 7
          if-no-files-found: error
