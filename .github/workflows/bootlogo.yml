      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install platformio

      - name: Build filesystem image
        run: |
          set -o pipefail
          cd bruce
          platformio run -e "$SELECTED_ENV" -t buildfs | tee "../fs-$SELECTED_ENV.log"

      - name: Locate image
        if: always()
        run: |
          echo "==== last 40 log lines ===="
          tail -n 40 "fs-$SELECTED_ENV.log" 2>/dev/null || echo "no log"
          echo "==== fs bins ===="
          find bruce/.pio -name "littlefs.bin" -o -name "spiffs.bin" 2>/dev/null
          mkdir -p out
          cp bruce/.pio/build/$SELECTED_ENV/littlefs.bin out/bootlogo-littlefs.bin 2>/dev/null || true

      - name: Upload boot logo image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bruce-bootlogo-{{ env.SELECTED_ENV }}
          path: out/bootlogo-littlefs.bin
          retention-days: 7
          if-no-files-found: error
